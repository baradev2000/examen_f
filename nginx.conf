server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend http://backend:8080;
    proxy_pass $backend;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Endpoint interne uniquement : il n'est pas publié par Docker ni par Traefik.
# nginx-prometheus-exporter l'utilise sur le réseau Compose "app".
server {
  listen 8080;
  server_name _;

  location = /stub_status {
    stub_status;
    access_log off;
  }

  location / {
    return 404;
  }
}
